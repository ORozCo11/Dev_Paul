<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Yellow Mercedes Sprinter ambulance">
  <defs>
    <linearGradient id="bgY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bodyY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
    <linearGradient id="glassY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f7"/>
      <stop offset="1" stop-color="#86abd5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgY)"/>
  <ellipse cx="400" cy="430" rx="320" ry="34" fill="#e0c64f" opacity="0.4"/>
  <!-- tall sprinter body -->
  <path d="M110 310 L110 180 Q110 162 128 162 L455 162 L520 210 L700 224 Q716 226 716 246 L716 310 Z" fill="url(#bodyY)" stroke="#d9a90f" stroke-width="3"/>
  <!-- green/white check stripe (INEM style) -->
  <rect x="110" y="268" width="606" height="24" fill="#ffffff"/>
  <g fill="#16a34a">
    <rect x="110" y="268" width="24" height="12"/><rect x="158" y="268" width="24" height="12"/>
    <rect x="206" y="268" width="24" height="12"/><rect x="254" y="268" width="24" height="12"/>
    <rect x="302" y="268" width="24" height="12"/><rect x="350" y="268" width="24" height="12"/>
    <rect x="398" y="268" width="24" height="12"/><rect x="446" y="268" width="24" height="12"/>
    <rect x="494" y="268" width="24" height="12"/><rect x="542" y="268" width="24" height="12"/>
    <rect x="590" y="268" width="24" height="12"/><rect x="638" y="268" width="24" height="12"/>
    <rect x="686" y="268" width="24" height="12"/>
    <rect x="134" y="280" width="24" height="12"/><rect x="182" y="280" width="24" height="12"/>
    <rect x="230" y="280" width="24" height="12"/><rect x="278" y="280" width="24" height="12"/>
    <rect x="326" y="280" width="24" height="12"/><rect x="374" y="280" width="24" height="12"/>
    <rect x="422" y="280" width="24" height="12"/><rect x="470" y="280" width="24" height="12"/>
    <rect x="518" y="280" width="24" height="12"/><rect x="566" y="280" width="24" height="12"/>
    <rect x="614" y="280" width="24" height="12"/><rect x="662" y="280" width="24" height="12"/>
  </g>
  <!-- cab window -->
  <path d="M470 200 L516 206 L596 216 L596 250 L470 250 Z" fill="url(#glassY)" stroke="#7d9fc6" stroke-width="2"/>
  <!-- side windows -->
  <rect x="150" y="190" width="90" height="46" rx="6" fill="url(#glassY)" stroke="#7d9fc6" stroke-width="2"/>
  <rect x="262" y="190" width="90" height="46" rx="6" fill="url(#glassY)" stroke="#7d9fc6" stroke-width="2"/>
  <!-- light bar -->
  <rect x="240" y="148" width="130" height="16" rx="7" fill="#1d4ed8"/>
  <rect x="244" y="150" width="58" height="12" rx="5" fill="#3b82f6"/>
  <rect x="308" y="150" width="58" height="12" rx="5" fill="#60a5fa"/>
  <!-- headlight -->
  <rect x="696" y="250" width="20" height="18" rx="4" fill="#fff7cc" stroke="#eab308" stroke-width="1.5"/>
  <text x="180" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1f2937" letter-spacing="3">INEM 112</text>
  <!-- wheels -->
  <circle cx="245" cy="336" r="46" fill="#1f2937"/><circle cx="245" cy="336" r="22" fill="#e5e7eb"/><circle cx="245" cy="336" r="9" fill="#6b7280"/>
  <circle cx="600" cy="336" r="46" fill="#1f2937"/><circle cx="600" cy="336" r="22" fill="#e5e7eb"/><circle cx="600" cy="336" r="9" fill="#6b7280"/>
</svg>
