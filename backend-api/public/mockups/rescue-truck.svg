<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Red and white rescue patrol truck">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="cabR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bedR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f7"/>
      <stop offset="1" stop-color="#86abd5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgR)"/>
  <ellipse cx="400" cy="430" rx="330" ry="34" fill="#e8a3ab" opacity="0.4"/>
  <!-- rescue bed -->
  <path d="M90 320 L90 226 Q90 212 104 212 L380 212 L380 320 Z" fill="url(#bedR)" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="104" y="232" width="262" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <!-- equipment lines on bed -->
  <g stroke="#dc2626" stroke-width="4">
    <line x1="124" y1="246" x2="124" y2="278"/><line x1="150" y1="246" x2="150" y2="278"/>
    <line x1="176" y1="246" x2="176" y2="278"/><line x1="202" y1="246" x2="202" y2="278"/>
  </g>
  <!-- cab -->
  <path d="M380 320 L380 188 Q380 172 398 172 L520 172 L584 250 L700 262 Q716 264 716 284 L716 320 Z" fill="url(#cabR)" stroke="#991b1b" stroke-width="3"/>
  <!-- white door panel -->
  <rect x="404" y="232" width="118" height="78" rx="8" fill="#ffffff" opacity="0.92"/>
  <g transform="translate(463 271)">
    <rect x="-7" y="-20" width="14" height="40" rx="3" fill="#dc2626"/>
    <rect x="-20" y="-7" width="40" height="14" rx="3" fill="#dc2626"/>
  </g>
  <!-- cab window -->
  <path d="M520 188 L566 232 L588 250 L520 250 Z" fill="url(#glassR)" stroke="#7d9fc6" stroke-width="2"/>
  <!-- light bar -->
  <rect x="412" y="158" width="120" height="16" rx="7" fill="#7f1d1d"/>
  <rect x="416" y="160" width="54" height="12" rx="5" fill="#ef4444"/>
  <rect x="474" y="160" width="54" height="12" rx="5" fill="#3b82f6"/>
  <!-- headlight + bumper -->
  <rect x="696" y="286" width="20" height="20" rx="4" fill="#fff7cc" stroke="#eab308" stroke-width="1.5"/>
  <rect x="90" y="306" width="626" height="16" rx="6" fill="#374151"/>
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#b91c1c" letter-spacing="2">RESCUE</text>
  <!-- wheels -->
  <circle cx="250" cy="338" r="50" fill="#111827"/><circle cx="250" cy="338" r="24" fill="#e5e7eb"/><circle cx="250" cy="338" r="10" fill="#6b7280"/>
  <circle cx="600" cy="338" r="50" fill="#111827"/><circle cx="600" cy="338" r="24" fill="#e5e7eb"/><circle cx="600" cy="338" r="10" fill="#6b7280"/>
</svg>
