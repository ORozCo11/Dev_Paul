<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="White wagon ambulance with red stripe">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bodyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe2ec"/>
    </linearGradient>
    <linearGradient id="glassW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f7"/>
      <stop offset="1" stop-color="#86abd5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgW)"/>
  <ellipse cx="400" cy="430" rx="320" ry="34" fill="#9aa7ba" opacity="0.4"/>
  <!-- compact wagon body -->
  <path d="M120 312 L120 244 Q120 210 168 204 L300 188 Q330 184 352 200 L470 240 L686 252 Q706 254 706 274 L706 312 Z"
        fill="url(#bodyW)" stroke="#c3cdda" stroke-width="3"/>
  <!-- red stripe -->
  <rect x="120" y="276" width="586" height="18" fill="#dc2626"/>
  <!-- windows -->
  <path d="M178 214 L300 200 Q322 198 338 210 L360 228 L360 246 L178 246 Z" fill="url(#glassW)" stroke="#9bb8da" stroke-width="2"/>
  <line x1="262" y1="200" x2="262" y2="246" stroke="#9bb8da" stroke-width="2"/>
  <path d="M372 230 L462 244 L462 262 L372 262 Z" fill="url(#glassW)" stroke="#9bb8da" stroke-width="2"/>
  <!-- medical cross -->
  <g transform="translate(225 250)">
    <rect x="-6" y="-18" width="12" height="36" rx="3" fill="#dc2626"/>
    <rect x="-18" y="-6" width="36" height="12" rx="3" fill="#dc2626"/>
  </g>
  <!-- roof light -->
  <rect x="220" y="172" width="96" height="14" rx="6" fill="#dc2626"/>
  <rect x="223" y="174" width="44" height="10" rx="4" fill="#ef4444"/>
  <rect x="271" y="174" width="42" height="10" rx="4" fill="#3b82f6"/>
  <!-- headlight -->
  <rect x="688" y="276" width="18" height="16" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="304" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#dc2626" letter-spacing="2">CADDY</text>
  <!-- wheels -->
  <circle cx="248" cy="320" r="44" fill="#1f2937"/><circle cx="248" cy="320" r="21" fill="#cbd5e1"/><circle cx="248" cy="320" r="8" fill="#64748b"/>
  <circle cx="580" cy="320" r="44" fill="#1f2937"/><circle cx="580" cy="320" r="21" fill="#cbd5e1"/><circle cx="580" cy="320" r="8" fill="#64748b"/>
</svg>
