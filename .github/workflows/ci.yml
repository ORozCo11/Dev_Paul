name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Backend tests (in-memory SQLite)
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-spa/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
      # Lint still reports older findings (see logs/regression-2026-10-21-lint-ledger.md).
      # It is shown on every run but does not block a merge until that backlog is cleared.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
