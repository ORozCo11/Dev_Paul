<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1580" viewBox="0 0 2600 1580" font-family="Arial, Helvetica, sans-serif"><rect width="2600" height="1580" fill="#fff"/><text x="1300" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#161616">Barangay VMS</text><line x1="1195" y1="92" x2="1405" y2="92" stroke="#161616" stroke-width="2.5"/><text x="1300" y="164" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="bold" fill="#161616">System Architecture</text><text x="1300" y="208" text-anchor="middle" font-size="19" fill="#4b5563">Layered implementation view</text><rect x="80" y="250" width="2440" height="230" rx="14" fill="#f5f6fc" stroke="#2430a0" stroke-width="2.5"/><path d="M80,264 a14,14 0 0 1 14,-14 h2412 a14,14 0 0 1 14,14 v34 h-2440 z" fill="#2430a0"/><text x="104" y="283" font-size="21" font-weight="bold" fill="#fff" letter-spacing="1">PRESENTATION LAYER  |  Browser</text><rect x="110" y="320" width="560" height="140" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="130" y="356" font-size="20" font-weight="bold" fill="#2430a0">React 19 / Vite 8 single-page app</text><text x="130" y="388" font-size="16.5" fill="#161616">&#8226; React Router, Axios client</text><text x="130" y="414" font-size="16.5" fill="#161616">&#8226; Leaflet maps</text><rect x="700" y="320" width="560" height="140" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="720" y="356" font-size="20" font-weight="bold" fill="#2430a0">Role workspaces</text><text x="720" y="388" font-size="16.5" fill="#161616">&#8226; Admin, Custodian, Maintenance Personnel</text><text x="720" y="414" font-size="16.5" fill="#161616">&#8226; Tickets, schedules, records, readiness</text><rect x="1290" y="320" width="560" height="140" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1310" y="356" font-size="20" font-weight="bold" fill="#2430a0">Super Admin portal</text><text x="1310" y="388" font-size="16.5" fill="#161616">&#8226; Accounts, barangays, codes</text><text x="1310" y="414" font-size="16.5" fill="#161616">&#8226; Concern review and platform audit</text><rect x="1880" y="320" width="610" height="140" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1900" y="356" font-size="20" font-weight="bold" fill="#2430a0">Public pages</text><text x="1900" y="388" font-size="16.5" fill="#161616">&#8226; Registration and activation</text><text x="1900" y="414" font-size="16.5" fill="#161616">&#8226; Support Center concern submission</text><line x1="1300" y1="480" x2="1300" y2="560" stroke="#2430a0" stroke-width="3.5"/><path d="M1300,480 l-9,16 h18 z M1300,560 l-9,-16 h18 z" fill="#2430a0"/><text x="1318" y="526" font-size="16" fill="#161616" font-weight="bold">JSON over HTTP(S)  |  Bearer token for protected calls</text><rect x="80" y="560" width="2440" height="300" rx="14" fill="#f5f6fc" stroke="#2430a0" stroke-width="2.5"/><path d="M80,574 a14,14 0 0 1 14,-14 h2412 a14,14 0 0 1 14,14 v34 h-2440 z" fill="#2430a0"/><text x="104" y="593" font-size="21" font-weight="bold" fill="#fff" letter-spacing="1">APPLICATION LAYER  |  Laravel 13 / PHP</text><rect x="110" y="630" width="470" height="200" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="130" y="666" font-size="20" font-weight="bold" fill="#2430a0">Public routes</text><text x="130" y="698" font-size="16.5" fill="#161616">&#8226; Login, registration, activation</text><text x="130" y="724" font-size="16.5" fill="#161616">&#8226; Public concern submission</text><text x="130" y="750" font-size="16.5" fill="#161616">&#8226; Geography and address suggestions</text><text x="130" y="776" font-size="16.5" fill="#161616">&#8226; Validated and rate-limited</text><rect x="600" y="630" width="470" height="200" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="620" y="666" font-size="20" font-weight="bold" fill="#2430a0">Protected API boundary</text><text x="620" y="698" font-size="16.5" fill="#161616">&#8226; Sanctum bearer authentication</text><text x="620" y="724" font-size="16.5" fill="#161616">&#8226; Active-account and platform guards</text><text x="620" y="750" font-size="16.5" fill="#161616">&#8226; Role, ownership and state checks</text><text x="620" y="776" font-size="16.5" fill="#161616">&#8226; Barangay scoping and validation</text><rect x="1090" y="630" width="470" height="200" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1110" y="666" font-size="20" font-weight="bold" fill="#2430a0">Controllers and domain logic</text><text x="1110" y="698" font-size="16.5" fill="#161616">&#8226; Fleet, tickets and verification</text><text x="1110" y="724" font-size="16.5" fill="#161616">&#8226; Schedules, records, readiness</text><text x="1110" y="750" font-size="16.5" fill="#161616">&#8226; Users, concerns, platform controls</text><text x="1110" y="776" font-size="16.5" fill="#161616">&#8226; Eloquent models, transactions, locks</text><rect x="1580" y="630" width="440" height="200" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1600" y="666" font-size="20" font-weight="bold" fill="#2430a0">Managed file handling</text><text x="1600" y="698" font-size="16.5" fill="#161616">&#8226; Private object references</text><text x="1600" y="724" font-size="16.5" fill="#161616">&#8226; Temporary signed links and renewal</text><text x="1600" y="750" font-size="16.5" fill="#161616">&#8226; Photos, documents, evidence</text><rect x="2040" y="630" width="450" height="200" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="2060" y="666" font-size="20" font-weight="bold" fill="#2430a0">Laravel scheduler</text><text x="2060" y="698" font-size="16.5" fill="#161616">&#8226; Every minute: due schedules to proposals</text><text x="2060" y="724" font-size="16.5" fill="#161616">&#8226; Hourly: expire unclaimed Admin signups</text><text x="2060" y="750" font-size="16.5" fill="#161616">&#8226; Daily: notification pruning</text><line x1="700" y1="880" x2="700" y2="940" stroke="#2430a0" stroke-width="3.5"/><path d="M700,880 l-9,16 h18 z M700,940 l-9,-16 h18 z" fill="#2430a0"/><text x="718" y="916" font-size="16" fill="#161616" font-weight="bold">Eloquent / SQL</text><line x1="1700" y1="880" x2="1700" y2="940" stroke="#2430a0" stroke-width="3.5"/><path d="M1700,880 l-9,16 h18 z M1700,940 l-9,-16 h18 z" fill="#2430a0"/><text x="1718" y="916" font-size="16" fill="#161616" font-weight="bold">private bytes</text><line x1="2250" y1="880" x2="2250" y2="940" stroke="#2430a0" stroke-width="3.5"/><path d="M2250,880 l-9,16 h18 z M2250,940 l-9,-16 h18 z" fill="#2430a0"/><text x="2268" y="916" font-size="16" fill="#161616" font-weight="bold">mail, tiles, lookups</text><rect x="80" y="940" width="1280" height="290" rx="14" fill="#f5f6fc" stroke="#2430a0" stroke-width="2.5"/><path d="M80,954 a14,14 0 0 1 14,-14 h1252 a14,14 0 0 1 14,14 v34 h-1280 z" fill="#2430a0"/><text x="104" y="973" font-size="21" font-weight="bold" fill="#fff" letter-spacing="1">PERSISTENCE LAYER</text><rect x="110" y="1010" width="610" height="190" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="130" y="1046" font-size="20" font-weight="bold" fill="#2430a0">Relational database</text><text x="130" y="1078" font-size="16.5" fill="#161616">&#8226; SQLite for local and testing</text><text x="130" y="1104" font-size="16.5" fill="#161616">&#8226; PostgreSQL is a planned deployment</text><text x="130" y="1130" font-size="16.5" fill="#161616">&#8226; Fleet and platform records, Sanctum tokens</text><rect x="740" y="1010" width="590" height="190" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="760" y="1046" font-size="20" font-weight="bold" fill="#2430a0">Private file storage</text><text x="760" y="1078" font-size="16.5" fill="#161616">&#8226; Supabase Storage when configured</text><text x="760" y="1104" font-size="16.5" fill="#161616">&#8226; Persistent local private fallback</text><text x="760" y="1130" font-size="16.5" fill="#161616">&#8226; Photos, documents, repair evidence</text><rect x="1400" y="940" width="1120" height="290" rx="14" fill="#f5f6fc" stroke="#2430a0" stroke-width="2.5"/><path d="M1400,954 a14,14 0 0 1 14,-14 h1092 a14,14 0 0 1 14,14 v34 h-1120 z" fill="#2430a0"/><text x="1424" y="973" font-size="21" font-weight="bold" fill="#fff" letter-spacing="1">EXTERNAL SERVICES</text><rect x="1430" y="1010" width="350" height="190" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1450" y="1046" font-size="20" font-weight="bold" fill="#2430a0">Mail transport</text><text x="1450" y="1078" font-size="16.5" fill="#161616">&#8226; Activation code and account emails</text><text x="1450" y="1104" font-size="16.5" fill="#161616">&#8226; AccountMail sends synchronously</text><rect x="1795" y="1010" width="350" height="190" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="1815" y="1046" font-size="20" font-weight="bold" fill="#2430a0">Map providers</text><text x="1815" y="1078" font-size="16.5" fill="#161616">&#8226; Esri map and satellite tiles</text><text x="1815" y="1104" font-size="16.5" fill="#161616">&#8226; Reverse-geocoding services</text><rect x="2160" y="1010" width="330" height="190" rx="14" fill="#fff" stroke="#9aa3d6" stroke-width="1.8"/><text x="2180" y="1046" font-size="20" font-weight="bold" fill="#2430a0">Photon / OpenStreetMap</text><text x="2180" y="1078" font-size="16.5" fill="#161616">&#8226; Opt-in address suggestions</text><text x="2180" y="1104" font-size="16.5" fill="#161616">&#8226; Manual-entry fallback</text><text x="80" y="1310" font-size="17" fill="#4b5563">Implementation view at revision 352fd0e  |  25 October 2026</text><text x="80" y="1338" font-size="17" fill="#4b5563">SQLite is the local and testing database. PostgreSQL and the deployment hosts are proposed; no live production deployment, SMTP delivery or hosted storage is claimed.</text><text x="80" y="1396" font-size="19" font-weight="bold" fill="#161616">How a request travels</text><text x="80" y="1430" font-size="17" fill="#161616">1. A Custodian proposal leaves the SPA with a bearer token and is checked for account, role and barangay scope.</text><text x="80" y="1458" font-size="17" fill="#161616">2. The controller runs the workflow change in a transaction; Admin approval assigns the repair.</text><text x="80" y="1486" font-size="17" fill="#161616">3. The mechanic logs evidence; an independent Custodian verifies it, which closes the ticket and clears prior readiness.</text><text x="80" y="1514" font-size="17" fill="#161616">4. The database stores the relationships; private storage holds the file bytes.</text></svg>