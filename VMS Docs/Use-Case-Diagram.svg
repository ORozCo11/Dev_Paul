<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1310" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1310" fill="#f6f8fb" />

  <text x="840" y="34" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Barangay VMS — Use Case Diagram</text>
  <text x="840" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">Actors sit outside the system boundary; each ellipse inside it is a capability that boundary offers them</text>

  <!-- ===================== SYSTEM BOUNDARY ===================== -->
  <rect x="200" y="90" width="1250" height="1175" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="825" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Barangay VMS</text>
  <text x="825" y="134" text-anchor="middle" font-size="10.5" fill="#94a3b8">system boundary</text>

  <!-- ===================== GROUP BOXES ===================== -->
  <!-- A: Access & Onboarding -->
  <rect x="225" y="140" width="590" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="245" y="168" font-size="14" font-weight="700" fill="#92400e">Access &amp; Onboarding</text>
  <text x="245" y="186" font-size="10.5" fill="#64748b">Public entry point — registration &amp; sign-in</text>

  <!-- B: Ticket & Repair Workflow -->
  <rect x="225" y="310" width="590" height="340" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="245" y="338" font-size="14" font-weight="700" fill="#1d4ed8">Ticket &amp; Repair Workflow</text>
  <text x="245" y="356" font-size="10.5" fill="#64748b">The core loop: Open → Active (per sub-issue) → Closed</text>

  <!-- C: Fleet & Location Management -->
  <rect x="225" y="670" width="590" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="245" y="698" font-size="14" font-weight="700" fill="#065f46">Fleet &amp; Location Management</text>
  <text x="245" y="716" font-size="10.5" fill="#64748b">The vehicle catalog, and where vehicles are stationed</text>

  <!-- D: Maintenance Planning -->
  <rect x="225" y="840" width="590" height="150" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="245" y="868" font-size="14" font-weight="700" fill="#0e7490">Maintenance Planning</text>
  <text x="245" y="886" font-size="10.5" fill="#64748b">Preventive care — scheduled and routine checks</text>

  <!-- E: Reporting & Oversight -->
  <rect x="225" y="1010" width="590" height="225" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="245" y="1034" font-size="14" font-weight="700" fill="#334155">Reporting &amp; Oversight</text>
  <text x="245" y="1050" font-size="10.5" fill="#64748b">Fleet-wide visibility and staff administration</text>

  <!-- F: Super Admin Console -->
  <rect x="845" y="140" width="590" height="1095" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="865" y="168" font-size="14" font-weight="700" fill="#4c1d95">Super Admin Console</text>
  <text x="865" y="186" font-size="10.5" fill="#64748b">Platform-wide, cross-Barangay — sees no fleet data</text>

  <!-- ===================== ASSOCIATIONS (actor -> use case, plain lines) ===================== -->
  <g stroke="#cbd5e1" stroke-width="1.2" opacity="0.9">
    <!-- Guest -->
    <line x1="90" y1="180" x2="323" y2="235"/>
    <!-- Admin -->
    <line x1="90" y1="460" x2="520" y2="235"/>
    <line x1="90" y1="460" x2="717" y2="235"/>
    <line x1="90" y1="460" x2="373" y2="400"/>
    <line x1="90" y1="460" x2="373" y2="570"/>
    <line x1="90" y1="460" x2="668" y2="570"/>
    <line x1="90" y1="460" x2="323" y2="765"/>
    <line x1="90" y1="460" x2="520" y2="765"/>
    <line x1="90" y1="460" x2="717" y2="765"/>
    <line x1="90" y1="460" x2="520" y2="935"/>
    <line x1="90" y1="460" x2="717" y2="935"/>
    <line x1="90" y1="460" x2="373" y2="1096"/>
    <line x1="90" y1="460" x2="668" y2="1096"/>
    <line x1="90" y1="460" x2="373" y2="1171"/>
    <!-- Custodian -->
    <line x1="90" y1="740" x2="520" y2="235"/>
    <line x1="90" y1="740" x2="668" y2="400"/>
    <line x1="90" y1="740" x2="668" y2="485"/>
    <line x1="90" y1="740" x2="717" y2="765"/>
    <line x1="90" y1="740" x2="323" y2="935"/>
    <line x1="90" y1="740" x2="717" y2="935"/>
    <line x1="90" y1="740" x2="668" y2="1171"/>
    <!-- Maintenance Personnel -->
    <line x1="90" y1="1010" x2="520" y2="235"/>
    <line x1="90" y1="1010" x2="373" y2="485"/>
    <line x1="90" y1="1010" x2="668" y2="1171"/>
    <!-- Super Admin -->
    <line x1="1560" y1="690" x2="520" y2="235"/>
    <line x1="1560" y1="690" x2="993" y2="235"/>
    <line x1="1560" y1="690" x2="1288" y2="235"/>
    <line x1="1560" y1="690" x2="993" y2="680"/>
    <line x1="1560" y1="690" x2="1288" y2="680"/>
    <line x1="1560" y1="690" x2="993" y2="1125"/>
    <line x1="1560" y1="690" x2="1288" y2="1125"/>
  </g>

  <!-- ===================== USE CASE ELLIPSES ===================== -->
  <g font-size="11" fill="#1e293b" text-anchor="middle">
    <!-- Group A -->
    <g>
      <ellipse cx="323" cy="235" rx="95" ry="34" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="323" y="239">Register Account</text>
    </g>
    <g>
      <ellipse cx="520" cy="235" rx="95" ry="34" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="520" y="239">Log In</text>
    </g>
    <g>
      <ellipse cx="717" cy="235" rx="95" ry="34" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="717" y="239">Approve Staff Signup</text>
    </g>

    <!-- Group B -->
    <g>
      <ellipse cx="373" cy="400" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="373" y="404">Create Maintenance Ticket</text>
    </g>
    <g>
      <ellipse cx="668" cy="400" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="668" y="397">Inspect Vehicle &amp;</text>
      <text x="668" y="412">Log Sub-Issues</text>
    </g>
    <g>
      <ellipse cx="373" cy="485" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="373" y="489">Repair Assigned Sub-Issue</text>
    </g>
    <g>
      <ellipse cx="668" cy="485" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="668" y="489">Verify Completed Repair</text>
    </g>
    <g>
      <ellipse cx="373" cy="570" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="373" y="567">Give Final Verdict</text>
      <text x="373" y="582">on Sub-Issue</text>
    </g>
    <g>
      <ellipse cx="668" cy="570" rx="108" ry="34" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="668" y="574">Close Ticket</text>
    </g>

    <!-- Group C -->
    <g>
      <ellipse cx="323" cy="765" rx="95" ry="34" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="323" y="762">Manage Vehicles &amp;</text>
      <text x="323" y="777">Vehicle Types</text>
    </g>
    <g>
      <ellipse cx="520" cy="765" rx="95" ry="34" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="520" y="769">Manage Hubs &amp; Locations</text>
    </g>
    <g>
      <ellipse cx="717" cy="765" rx="95" ry="34" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="717" y="769">View Vehicle History</text>
    </g>

    <!-- Group D -->
    <g>
      <ellipse cx="323" cy="935" rx="95" ry="34" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="323" y="932">Record Condition</text>
      <text x="323" y="947">Monitoring Check</text>
    </g>
    <g>
      <ellipse cx="520" cy="935" rx="95" ry="34" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="520" y="932">Manage Maintenance</text>
      <text x="520" y="947">Schedule</text>
    </g>
    <g>
      <ellipse cx="717" cy="935" rx="95" ry="34" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="717" y="939">Log Maintenance Record</text>
    </g>

    <!-- Group E -->
    <g>
      <ellipse cx="373" cy="1096" rx="108" ry="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="373" y="1100">Generate Reports</text>
    </g>
    <g>
      <ellipse cx="668" cy="1096" rx="108" ry="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="668" y="1100">View Activity Log</text>
    </g>
    <g>
      <ellipse cx="373" cy="1171" rx="108" ry="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="373" y="1175">Manage Staff Accounts</text>
    </g>
    <g>
      <ellipse cx="668" cy="1171" rx="108" ry="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <text x="668" y="1175">Submit Concern Report</text>
    </g>

    <!-- Group F -->
    <g>
      <ellipse cx="993" cy="235" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="993" y="239">Approve First-Ever Admin</text>
    </g>
    <g>
      <ellipse cx="1288" cy="235" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="1288" y="239">Manage Registration Codes</text>
    </g>
    <g>
      <ellipse cx="993" cy="680" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="993" y="684">Manage Barangays</text>
    </g>
    <g>
      <ellipse cx="1288" cy="680" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="1288" y="684">Impersonate Staff Account</text>
    </g>
    <g>
      <ellipse cx="993" cy="1125" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="993" y="1129">Handle Concern Reports</text>
    </g>
    <g>
      <ellipse cx="1288" cy="1125" rx="108" ry="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="1288" y="1129">View Cross-Barangay Users</text>
    </g>
  </g>

  <!-- ===================== SPECIAL USE-CASE RELATIONSHIPS ===================== -->
  <g stroke="#334155" stroke-width="1.4" stroke-dasharray="6,4" fill="none">
    <line x1="885" y1="235" x2="418" y2="235" marker-end="url(#uc-arrow)"/>
    <line x1="481" y1="400" x2="560" y2="400" marker-end="url(#uc-arrow)"/>
    <line x1="775" y1="1166" x2="886" y2="1130" marker-end="url(#uc-arrow)"/>
  </g>
  <g font-size="10" font-style="italic" fill="#334155" text-anchor="middle">
    <text x="651" y="220">«extend» (no Admin yet for this Barangay)</text>
    <text x="520" y="388">«include»</text>
    <text x="830" y="1140">notifies</text>
  </g>

  <!-- ===================== ACTORS ===================== -->
  <g stroke="#475569" fill="none" stroke-width="2.2" stroke-linecap="round">
    <!-- Guest -->
    <g transform="translate(90,180)">
      <circle cx="0" cy="-34" r="11" fill="#ffffff"/>
      <line x1="0" y1="-23" x2="0" y2="10"/>
      <line x1="-15" y1="-10" x2="15" y2="-10"/>
      <line x1="0" y1="10" x2="-13" y2="35"/>
      <line x1="0" y1="10" x2="13" y2="35"/>
    </g>
    <!-- Admin -->
    <g transform="translate(90,460)" stroke="#b45309">
      <circle cx="0" cy="-34" r="11" fill="#ffffff"/>
      <line x1="0" y1="-23" x2="0" y2="10"/>
      <line x1="-15" y1="-10" x2="15" y2="-10"/>
      <line x1="0" y1="10" x2="-13" y2="35"/>
      <line x1="0" y1="10" x2="13" y2="35"/>
    </g>
    <!-- Custodian -->
    <g transform="translate(90,740)" stroke="#b45309">
      <circle cx="0" cy="-34" r="11" fill="#ffffff"/>
      <line x1="0" y1="-23" x2="0" y2="10"/>
      <line x1="-15" y1="-10" x2="15" y2="-10"/>
      <line x1="0" y1="10" x2="-13" y2="35"/>
      <line x1="0" y1="10" x2="13" y2="35"/>
    </g>
    <!-- Maintenance Personnel -->
    <g transform="translate(90,1010)" stroke="#b45309">
      <circle cx="0" cy="-34" r="11" fill="#ffffff"/>
      <line x1="0" y1="-23" x2="0" y2="10"/>
      <line x1="-15" y1="-10" x2="15" y2="-10"/>
      <line x1="0" y1="10" x2="-13" y2="35"/>
      <line x1="0" y1="10" x2="13" y2="35"/>
    </g>
    <!-- Super Admin -->
    <g transform="translate(1560,690)" stroke="#6d28d9">
      <circle cx="0" cy="-34" r="11" fill="#ffffff"/>
      <line x1="0" y1="-23" x2="0" y2="10"/>
      <line x1="-15" y1="-10" x2="15" y2="-10"/>
      <line x1="0" y1="10" x2="-13" y2="35"/>
      <line x1="0" y1="10" x2="13" y2="35"/>
    </g>
  </g>
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="90" y="232" fill="#475569">Guest /</text>
    <text x="90" y="248" fill="#475569">Resident</text>
    <text x="90" y="512" fill="#92400e">Admin</text>
    <text x="90" y="792" fill="#92400e">Custodian</text>
    <text x="90" y="1062" fill="#92400e">Maintenance</text>
    <text x="90" y="1078" fill="#92400e">Personnel</text>
    <text x="1560" y="742" fill="#4c1d95">Super Admin</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11" fill="#334155">
    <line x1="620" y1="1284" x2="660" y2="1284" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="668" y="1288">actor participates in the use case</text>
    <line x1="960" y1="1284" x2="1000" y2="1284" stroke="#334155" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#uc-arrow)"/>
    <text x="1008" y="1288">«include» / «extend» / notifies — relation between use cases</text>
  </g>
</svg>
